function nodeId(node,path){return path.join('>')}

function getCount(node){
  if(node.count)return node.count;
  let n=node.members?node.members.length:0;
  if(node.children)node.children.forEach(c=>n+=getCount(c));
  return n;
}

function measureTree(node,depth,path){
  const id=nodeId(node,path);
  const isCollapsed=collapsed[id];
  const kids=(node.children||[]);
  const hasLeafMembers=node.members&&node.members.length>0&&depth>0;
  const leafCount=hasLeafMembers?node.members.length:0;

  if(depth===0){
    if(isCollapsed||(!kids.length&&!hasLeafMembers)){
      node._h=ROOT_H;node._subtreeH=ROOT_H;return;
    }
  }

  if(isCollapsed){
    node._h=NODE_H;node._subtreeH=NODE_H;return;
  }

  const childBlocks=[];
  kids.forEach((c,i)=>measureTree(c,depth+1,[...path,node.name+i]));

  let total=0;
  kids.forEach(c=>{total+=c._subtreeH+GAP_Y;});
  if(leafCount>0){
    const rows=Math.ceil(leafCount/3);
    node._leafBlockH=rows*(LEAF_H+GAP_Y)-GAP_Y;
    total+=node._leafBlockH+GAP_Y;
  }
  if(total>0)total-=GAP_Y;

  const selfH=depth===0?ROOT_H:NODE_H;
  node._h=selfH;
  node._subtreeH=Math.max(selfH,total);
}

function drawRoundRect(x,y,w,h,r,fill,stroke,sw){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);
  ctx.closePath();
  if(fill){ctx.fillStyle=fill;ctx.fill();}
  if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=sw||0.5;ctx.stroke();}
}

function drawCurve(x1,y1,x2,y2){
  ctx.beginPath();
  const mx=(x1+x2)/2;
  ctx.moveTo(x1,y1);
  ctx.bezierCurveTo(mx,y1,mx,y2,x2,y2);
  ctx.strokeStyle=C.line;ctx.lineWidth=1.5;ctx.stroke();
}

function truncate(str,maxW){
  const lines=str.split('\n');
  const result=[];
  lines.forEach(line=>{
    if(ctx.measureText(line).width<=maxW){result.push(line);return;}
    let s=line;
    while(ctx.measureText(s+'…').width>maxW&&s.length>0)s=s.slice(0,-1);
    result.push(s+'…');
  });
  return result;
}

function drawNode(node,x,y,w,h,depth,path){
  const id=nodeId(node,path);
  const isRoot=depth===0;
  const isCollapsed=collapsed[id];
  const hasKids=(node.children&&node.children.length>0)||node.members;

  if(isRoot){
    drawRoundRect(x,y,w,h,10,C.rootBg,C.rootBorder,1.5);
    ctx.fillStyle=C.rootText;ctx.font='500 15px var(--font-sans,sans-serif)';ctx.textAlign='left';
    const lines=node.name.split('\n');
    const totalH=lines.length*20;const startY=y+(h-totalH)/2+14;
    lines.forEach((l,i)=>ctx.fillText(l,x+14,startY+i*20));
    if(node.sub){ctx.fillStyle=C.rootSub;ctx.font='12px var(--font-sans,sans-serif)';ctx.fillText(node.sub,x+14,y+h-10);}
  } else if(node.members&&!node.children){
    drawRoundRect(x,y,w,h,8,C.deptBg,C.deptBorder,1);
    ctx.fillStyle=C.deptText;ctx.font='500 13px var(--font-sans,sans-serif)';ctx.textAlign='left';
    const lines=truncate(node.name,w-30);
    const startY=lines.length===1?y+h/2+4:y+h/2-4;
    lines.forEach((l,i)=>ctx.fillText(l,x+10,startY+i*16));
    if(node.count!=null){
      const bw=28,bh=20,bx=x+w-bw-4,by=y+(h-bh)/2;
      drawRoundRect(bx,by,bw,bh,10,C.badge,C.badgeBorder,0.5);
      ctx.fillStyle=C.badgeText;ctx.font='500 11px var(--font-sans,sans-serif)';ctx.textAlign='center';
      ctx.fillText(node.count,bx+bw/2,by+14);
    }
  } else {
    drawRoundRect(x,y,w,h,8,C.nodeBg,C.nodeBorder,1);
    ctx.fillStyle=C.nodeText;ctx.font='500 13px var(--font-sans,sans-serif)';ctx.textAlign='left';
    const lines=truncate(node.name,w-38);
    const startY=lines.length===1?y+h/2+4:y+h/2-4;
    lines.forEach((l,i)=>ctx.fillText(l,x+10,startY+i*16));
    if(node.count!=null){
      const bw=28,bh=20,bx=x+w-bw-4,by=y+(h-bh)/2;
      drawRoundRect(bx,by,bw,bh,10,C.badge,C.badgeBorder,0.5);
      ctx.fillStyle=C.badgeText;ctx.font='500 11px var(--font-sans,sans-serif)';ctx.textAlign='center';
      ctx.fillText(node.count,bx+bw/2,by+14);
    }
  }
  ctx.textAlign='left';
}

let hitZones=[];
let totalH=0,totalW=0;

function drawTree(node,x,y,depth,path){
  const id=nodeId(node,path);
  const isCollapsed=collapsed[id];
  const w=depth===0?ROOT_W:NODE_W;
  const h=depth===0?ROOT_H:NODE_H;
  const nodeY=y+(node._subtreeH-h)/2;

  hitZones.push({x,y:nodeY,w,h,id,node,depth,path});
  drawNode(node,x,nodeY,w,h,depth,path);

  if(isCollapsed)return;

  const kids=node.children||[];
  const hasLeafMembers=node.members&&node.members.length>0&&depth>0;
  const allItems=[...kids];
  if(hasLeafMembers){
    allItems.push({_isLeafBlock:true,members:node.members,_leafBlockH:node._leafBlockH||40});
  }
  if(!allItems.length)return;

  const childX=x+w+GAP_X;
  let cy=y;
  const nodeConnectX=x+w;
  const nodeConnectY=nodeY+h/2;

  allItems.forEach((child,i)=>{
    const cPath=[...path,node.name+i];
    if(child._isLeafBlock){
      const bh=child._leafBlockH||40;
      const blockCy=cy+(bh-h)/2;
      const members=child.members;
      const rows=Math.ceil(members.length/3);
      let rowY=cy;
      for(let r=0;r<rows;r++){
        const rowMembers=members.slice(r*3,(r+1)*3);
        rowMembers.forEach((m,mi)=>{
          const lx=childX+mi*(LEAF_W+8);
          const ly=rowY;
          drawRoundRect(lx,ly,LEAF_W,LEAF_H,8,C.nodeBg,C.nodeBorder,0.5);
          ctx.fillStyle=C.leafText;ctx.font='500 12px var(--font-sans,sans-serif)';ctx.textAlign='left';
          const name=m.split(/(?=[A-Z\u4e00-\u9fa5])/)[0]||m;
          const lines=truncate(m,LEAF_W-16);
          const chinese=m.match(/[\u4e00-\u9fa5]+/);
          ctx.fillText(lines[0],lx+8,ly+18);
          if(chinese&&lines[0]!==m){
            ctx.fillStyle=C.leafSub;ctx.font='11px var(--font-sans,sans-serif)';
            ctx.fillText('| '+chinese[0],lx+8,ly+32);
          }
          if(r===0&&mi===0){
            drawCurve(nodeConnectX,nodeConnectY,lx,ly+LEAF_H/2);
          }
          totalW=Math.max(totalW,lx+LEAF_W+20);
          totalH=Math.max(totalH,ly+LEAF_H+20);
        });
        rowY+=LEAF_H+GAP_Y;
      }
      cy+=bh+GAP_Y;
    } else {
      measureTree(child,depth+1,cPath);
      const childNodeH=child._h||NODE_H;
      const childNodeY=cy+(child._subtreeH-childNodeH)/2;
      const connectY=childNodeY+childNodeH/2;
      drawCurve(nodeConnectX,nodeConnectY,childX,connectY);
      drawTree(child,childX,cy,depth+1,cPath);
      totalW=Math.max(totalW,childX+NODE_W+20);
      totalH=Math.max(totalH,cy+child._subtreeH+20);
      cy+=child._subtreeH+GAP_Y;
    }
  });
}

function render(){
  hitZones=[];totalH=0;totalW=0;
  measureTree(data,0,[]);
  const canvasH=Math.max(data._subtreeH+80,600);
  const canvasW=Math.max(totalW+100,1200);
  canvas.width=canvasW*DPR;canvas.height=canvasH*DPR;
  canvas.style.width=canvasW+'px';canvas.style.height=canvasH+'px';
  ctx.scale(DPR,DPR);
  ctx.clearRect(0,0,canvasW,canvasH);
  drawTree(data,30,40,0,[]);
  canvas.style.width=Math.max(totalW+40,800)+'px';
  canvas.style.height=Math.max(totalH+40,400)+'px';
  canvas.width=(Math.max(totalW+40,800))*DPR;
  canvas.height=(Math.max(totalH+40,400))*DPR;
  ctx.scale(DPR,DPR);
  ctx.clearRect(0,0,9999,9999);
  drawTree(data,30,40,0,[]);
}

canvas.addEventListener('click',e=>{
  const rect=canvas.getBoundingClientRect();
  const sx=canvas.width/DPR/rect.width;
  const sy=canvas.height/DPR/rect.height;
  const mx=(e.clientX-rect.left)*sx;
  const my=(e.clientY-rect.top)*sy;
  for(let i=hitZones.length-1;i>=0;i--){
    const z=hitZones[i];
    if(mx>=z.x&&mx<=z.x+z.w&&my>=z.y&&my<=z.y+z.h){
      if(z.depth===0)return;
      collapsed[z.id]=!collapsed[z.id];
      render();
      return;
    }
  }
});

canvas.style.cursor='pointer';

function expandAll(){Object.keys(collapsed).forEach(k=>delete collapsed[k]);render();}
function collapseAll(){
  function walk(node,path,depth){
    if(depth===0){(node.children||[]).forEach((c,i)=>walk(c,[...path,node.name+i],1));return;}
    const id=nodeId(node,path);collapsed[id]=true;
    (node.children||[]).forEach((c,i)=>walk(c,[...path,node.name+i],depth+1));
  }
  walk(data,[],0);render();
}
function resetZoom(){document.getElementById('wrap').scrollTo(0,0);}

render();
</script>
